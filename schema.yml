  /api/v1/avatars/:
    post:
      operationId: avatars_create
      tags:
      - avatars
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AvatarCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AvatarCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AvatarCreateRequest'
        required: true
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvatarCreate'
          description: ''
  /api/v1/avatars/{id}/save/:
    post:
      operationId: avatars_save_create
      description: |-
        On-demand Cloudinary save endpoint for completed avatars.
        Downloads the fal.ai result from fal_cdn_url, uploads it to Cloudinary (saving to result_image),
        sets is_saved=True, and returns the persistent Cloudinary URL.
        Idempotent: if already saved, returns the saved avatar without re-uploading.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - avatars
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Avatar'
          description: ''
  /api/v1/avatars/{id}/status/:
    get:
      operationId: avatars_status_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - avatars
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Avatar'
          description: ''
  /api/v1/avatars/admin/defaults/:
    get:
      operationId: avatars_admin_defaults_list
      description: |-
        Admin-only endpoint for managing system default avatars (male/female x realistic/cartoon).
        GET: Returns all configured system default avatars.
        POST: Uploads the provided image to Cloudinary and updates or creates the system default
              for the specified (gender, style) combination.
      tags:
      - avatars
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Avatar'
          description: ''
    post:
      operationId: avatars_admin_defaults_create
      description: |-
        Admin-only endpoint for managing system default avatars (male/female x realistic/cartoon).
        GET: Returns all configured system default avatars.
        POST: Uploads the provided image to Cloudinary and updates or creates the system default
              for the specified (gender, style) combination.
      tags:
      - avatars
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SystemDefaultAvatarAdminRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SystemDefaultAvatarAdminRequest'
          application/json:
            schema:
              $ref: '#/components/schemas/SystemDefaultAvatarAdminRequest'
        required: true
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Avatar'
          description: ''
  /api/v1/avatars/default/:
    get:
      operationId: avatars_default_retrieve
      description: Retrieves the user's current default avatar. Returns the user's
        preferred completed avatar if one exists. Otherwise, falls back to the admin-managed
        system default matching the user's gender and requested style.
      summary: Get Current Default Avatar
      parameters:
      - in: query
        name: style
        schema:
          type: string
          enum:
          - cartoon
          - realistic
        description: 'Avatar style: ''realistic'' or ''cartoon'''
        required: true
      tags:
      - avatars
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Avatar'
          description: ''
        '400':
          description: 'Bad Request: Missing or invalid ''style'' query parameter.'
  /api/v1/avatars/mine/:
    get:
      operationId: avatars_mine_list
      tags:
      - avatars
