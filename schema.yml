components:
  schemas:
    Aesthetic:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          readOnly: true
        image:
          type: string
          format: uri
          nullable: true
          readOnly: true
      required:
      - id
      - image
      - name
    Avatar:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/StatusEnum'
          readOnly: true
        gender:
          readOnly: true
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/Gender0acEnum'
          - $ref: '#/components/schemas/NullEnum'
        style:
          allOf:
          - $ref: '#/components/schemas/StyleEnum'
          readOnly: true
          default: realistic
        is_default:
          type: boolean
          readOnly: true
          default: false
        is_preferred:
          type: boolean
          readOnly: true
        is_saved:
          type: boolean
          readOnly: true
        source_photo:
          type: string
          format: uri
          nullable: true
          readOnly: true
        result_image:
          type: string
          format: uri
          nullable: true
          readOnly: true
        fal_cdn_url:
          type: string
          format: uri
          readOnly: true
          nullable: true
        error_message:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - error_message
      - fal_cdn_url
      - gender
      - id
      - is_default
      - is_preferred
      - is_saved
      - result_image
      - source_photo
      - status
      - style
      - updated_at
    AvatarCreate:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        source_photo:
          type: string
          format: uri
        style:
          allOf:
          - $ref: '#/components/schemas/StyleEnum'
          default: realistic
      required:
      - id
      - source_photo
    AvatarCreateRequest:
      type: object
      properties:
        source_photo:
          type: string
          format: binary
        style:
          allOf:
          - $ref: '#/components/schemas/StyleEnum'
          default: realistic
      required:
      - source_photo
    BlankEnum:
      enum:
      - ''
    BodyTypeEnum:
      enum:
      - slim
      - athletic
      - average
      - curvy
      - plus_size
      type: string
      description: |-
        * `slim` - Slim
        * `athletic` - Athletic
        * `average` - Average
        * `curvy` - Curvy
        * `plus_size` - Plus Size
    Category:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 100
        slug:
          oneOf:
          - type: string
            maxLength: 50
            pattern: ^[-a-zA-Z0-9_]+$
          - type: string
            maxLength: 0
      required:
      - id
      - name
    ChangePasswordRequest:
      type: object
      properties:
        old_password:
          type: string
          writeOnly: true
          minLength: 1
        new_password:
          type: string
          writeOnly: true
          minLength: 1
        new_password_confirm:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - new_password
      - new_password_confirm
      - old_password
    CompleteProfile:
      type: object
      properties:
        age:
          type: integer
          maximum: 32767
          minimum: 0
          nullable: true
        gender:
          oneOf:
          - $ref: '#/components/schemas/Gender0acEnum'
          - $ref: '#/components/schemas/BlankEnum'
        height:
          type: integer
          maximum: 32767
          minimum: 0
          nullable: true
          description: Height in centimeters.
        body_type:
          oneOf:
          - $ref: '#/components/schemas/BodyTypeEnum'
          - $ref: '#/components/schemas/BlankEnum'
        country:
          type: string
          maxLength: 100
        aesthetics:
          type: array
          items:
            type: integer
    ConvertRequestRequest:
      type: object
      properties:
        outfit_job_id:
          type: integer
          description: ID of the completed OutfitJob to convert into 3D.
      required:
      - outfit_job_id
    DeleteAccountRequest:
      type: object
      properties:
        password:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - password
    ForgotPasswordRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
      required:
      - email
    Gender0acEnum:
      enum:
      - male
      - female
      - other
      type: string
      description: |-
        * `male` - Male
        * `female` - Female
        * `other` - Other
    ItemAnalysis:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        wardrobe_item:
          type: integer
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/StatusEnum'
          readOnly: true
        is_saved:
          type: boolean
          readOnly: true
        display_url:
          type: string
          readOnly: true
        fal_cdn_url:
          type: string
          format: uri
          readOnly: true
        processed_image:
          type: string
          readOnly: true
        color:
          type: string
          readOnly: true
        description:
          type: string
          readOnly: true
        error_message:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - color
      - created_at
      - description
      - display_url
      - error_message
      - fal_cdn_url
      - id
      - is_saved
      - processed_image
      - status
      - updated_at
      - wardrobe_item
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
        password:
          type: string
          writeOnly: true
          minLength: 1
      required:
