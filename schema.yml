          description: ''
  /api/v1/model3d/convert/:
    post:
      operationId: model3d_convert_create
      description: Converts a completed OutfitJob image into a downloadable 3D model
        (.glb) using fal.ai Hunyuan 3D v3.1 Pro.
      tags:
      - model3d
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConvertRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ConvertRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ConvertRequestRequest'
        required: true
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThreeDConversion'
          description: ''
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThreeDConversion'
          description: ''
  /api/v1/model3d/webhook/:
    post:
      operationId: model3d_webhook_create
      tags:
      - model3d
      security:
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/news/:
    get:
      operationId: news_list
      tags:
      - news
      security:
      - jwtAuth: []
      - BearerAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PostList'
          description: ''
  /api/v1/news/{slug}/:
    get:
      operationId: news_retrieve
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - news
      security:
      - jwtAuth: []
      - BearerAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostDetail'
          description: ''
  /api/v1/outfits/public/{username}/:
    get:
      operationId: outfits_public_list
      description: |-
        GET /api/v1/outfits/public/<username>/ - a user's saved outfits that they've
        marked as shared (is_shared=True), for display on their public profile.
        Shows only the aggregate rating (count/average/breakdown) — not who rated it.
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: path
        name: username
        schema:
          type: string
        required: true
      tags:
      - outfits
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPublicSavedOutfitList'
          description: ''
  /api/v1/outfits/saved/:
    get:
      operationId: outfits_saved_list
      tags:
      - outfits
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SavedOutfit'
          description: ''
    post:
      operationId: outfits_saved_create
      tags:
      - outfits
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SavedOutfitCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SavedOutfitCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SavedOutfitCreateRequest'
        required: true
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavedOutfitCreate'
          description: ''
  /api/v1/outfits/saved/{id}/:
    get:
      operationId: outfits_saved_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - outfits
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavedOutfit'
          description: ''
    put:
      operationId: outfits_saved_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - outfits
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SavedOutfitUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SavedOutfitUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SavedOutfitUpdateRequest'
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavedOutfitUpdate'
          description: ''
    patch:
      operationId: outfits_saved_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - outfits
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedSavedOutfitUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedSavedOutfitUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedSavedOutfitUpdateRequest'
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavedOutfitUpdate'
          description: ''
    delete:
      operationId: outfits_saved_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - outfits
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/outfits/saved/{id}/rate/:
    post:
      operationId: outfits_saved_rate_create
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - outfits
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OutfitRatingRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OutfitRatingRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OutfitRatingRequest'
        required: true
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OutfitRating'
          description: ''
    delete:
      operationId: outfits_saved_rate_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - outfits
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/outfits/saved/{id}/ratings/:
    get:
      operationId: outfits_saved_ratings_list
      description: |-
        GET /api/v1/outfits/saved/<pk>/ratings/ - who rated this outfit and what they
        gave. Owner-only: strangers only ever see the aggregate via the public
        profile endpoint, never individual raters' identities.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - outfits
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedSavedOutfitRatingDetailList'
          description: ''
  /api/v1/outfits/today/:
    get:
      operationId: outfits_today_retrieve
      description: |-
        Dashboard-triggered lazy daily AUTO OutfitJob generation & retrieval endpoint.
        GET /api/v1/outfits/today/
      tags:
      - outfits
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TodayOutfit'
          description: ''
  /api/v1/outfits/today/reset/:
    delete:
      operationId: outfits_today_reset_destroy
      description: Development/testing endpoint to reset today's AUTO OutfitJob for
